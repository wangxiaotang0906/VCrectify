[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vcevo"
version = "0.1.0"
description = "Evidence-adjudicated continual learning for pluggable virtual cells"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [{name = "VCevo contributors"}]
dependencies = ["numpy>=1.24,<3", "scipy>=1.9", "h5py>=3.7", "PyYAML>=6", "requests>=2.28"]

[project.optional-dependencies]
test = ["pytest>=7", "ruff>=0.9"]
llm = ["torch>=2.2", "transformers>=4.51,<5", "accelerate>=0.26", "safetensors>=0.4"]
plots = ["matplotlib>=3.6"]

[project.urls]
Repository = "https://github.com/wangxiaotang0906/VCevo"
Issues = "https://github.com/wangxiaotang0906/VCevo/issues"

[project.scripts]
vcevo = "vcevo.cli:main"

[tool.setuptools]
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/vcevo" = ["THIRD_PARTY_NOTICES.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py39"
line-length = 110

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

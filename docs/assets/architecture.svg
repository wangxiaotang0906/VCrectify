<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">VCevo: predict, acquire, adjudicate, correct</title><desc id="desc">Two interchangeable virtual cells share aligned conditions. Active acquisition selects experiments, sealed predictions are assessed after outcomes arrive, and each state is corrected independently.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#64748b" stroke-width="1.7"/></marker></defs>
<rect width="1200" height="520" rx="24" fill="#f5f7fa"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="44" y="49" font-size="16" fill="#57677d" letter-spacing="3">EVIDENCE-ADJUDICATED CONTINUAL LEARNING</text>
<text x="44" y="97" font-size="37" font-weight="700" fill="#142236">Two states. One experimental feedback loop.</text>
<rect x="44" y="144" width="270" height="128" rx="15" fill="#e1f2ef" stroke="#169183"/><text x="64" y="177" font-size="13" fill="#15786f" letter-spacing="2">NUMERICAL VIRTUAL CELL</text><text x="64" y="214" font-size="21" font-weight="700" fill="#142236">TxPert / your model</text><text x="64" y="247" font-size="16" fill="#46556a">Continuous expression effects</text>
<rect x="44" y="293" width="270" height="128" rx="15" fill="#e9e8f7" stroke="#8173b5"/><text x="64" y="326" font-size="13" fill="#68569a" letter-spacing="2">KNOWLEDGE VIRTUAL CELL</text><text x="64" y="363" font-size="21" font-weight="700" fill="#142236">SUMMER / your model</text><text x="64" y="396" font-size="16" fill="#46556a">Labels, evidence IDs, rationales</text>
<path d="M314 206H343V276H376M314 356H343V276" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="380" y="206" width="210" height="140" rx="15" fill="white" stroke="#bdc8d6"/><text x="400" y="240" font-size="14" fill="#57677d">01 / PREDICT &amp; ACQUIRE</text><text x="400" y="274" font-size="20" font-weight="700" fill="#142236">Choose evidence</text><text x="400" y="303" font-size="16" fill="#46556a">Half disagreement</text><text x="400" y="326" font-size="16" fill="#46556a">Half random exploration</text>
<path d="M590 276H624" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="630" y="206" width="210" height="140" rx="15" fill="white" stroke="#bdc8d6"/><text x="650" y="240" font-size="14" fill="#57677d">02 / SEAL &amp; OBSERVE</text><text x="650" y="274" font-size="20" font-weight="700" fill="#142236">Reveal outcomes</text><text x="650" y="303" font-size="16" fill="#46556a">Predictions recorded first</text><text x="650" y="326" font-size="16" fill="#46556a">Held-out labels isolated</text>
<path d="M840 276H874" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="880" y="180" width="276" height="194" rx="15" fill="#fbefe3" stroke="#cf8748"/><text x="900" y="214" font-size="14" fill="#996023">03 / ADJUDICATE &amp; CORRECT</text><text x="900" y="249" font-size="20" font-weight="700" fill="#142236">Independent error gates</text><text x="900" y="282" font-size="17" fill="#46556a">Numerical weights + replay</text><text x="900" y="312" font-size="17" fill="#46556a">Cited knowledge reliabilities</text><text x="900" y="345" font-size="14" fill="#996023">Neither · Numerical · Knowledge · Both</text>
<path d="M1018 374V450H177V427" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="410" y="434" width="440" height="30" fill="#f5f7fa"/><text x="420" y="455" font-size="17" fill="#46556a">Updated states select the next experiment</text>
<text x="44" y="494" font-size="13" fill="#6d7b8e">PLUGGABLE BACKBONES</text><text x="880" y="494" font-size="13" fill="#6d7b8e">AUDITABLE STATE · REPRODUCIBLE SPLITS</text></g></svg>
